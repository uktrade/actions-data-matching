name: Setup toolchain
description: Checkout the repository and install uv with Python, optionally just and bun

inputs:
  fetch-depth:
    description: Number of commits to fetch (0 for full history)
    required: false
    default: "1"
  python-version:
    description: Python version to install
    required: false
    default: "3.13"
  install-just:
    description: Whether to install just
    required: false
    default: "true"
  install-bun:
    description: Whether to install bun
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install uv and Python
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ inputs.python-version }}

    - name: Install just
      if: ${{ inputs.install-just == 'true' }}
      uses: extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2 # v2.0.1
      with:
        repo: casey/just
        version: 1.55.1

    - name: Install bun
      if: ${{ inputs.install-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14
