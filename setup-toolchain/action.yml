name: Setup toolchain
description: Checkout the repository and install uv with Python, optionally just and bun

inputs:
  fetch-depth:
    description: Number of commits to fetch (0 for full history)
    required: false
    default: "1"
  python-version:
    description: Python version to install
    required: false
    default: "3.13"
  install-just:
    description: Whether to install just
    required: false
    default: "true"
  install-bun:
    description: Whether to install bun
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install uv and Python
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ inputs.python-version }}

    - name: Install just
      if: ${{ inputs.install-just == 'true' }}
      uses: extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2 # v2.0.1
      with:
        repo: casey/just
        version: 1.59.0

    - name: Install bun
      if: ${{ inputs.install-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
